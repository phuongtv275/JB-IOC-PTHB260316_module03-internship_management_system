spring.application.name=internship-management-system

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/internship-management-system
spring.datasource.username=rikkei
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.data.web.pageable.max-page-size=100

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-NO_TRACE}] %logger{36} : %msg%n

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
